name: Cloud Security AI - CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python files
        run: |
          python -m py_compile app.py
          python -m py_compile risk_engine.py
          python -m py_compile ai_explainer.py
          python -m py_compile prowler_parser.py
          python -m py_compile remediation.py

      - name: Test risk engine
        run: |
          python -c "from risk_engine import calculate_risk; finding={'severity':'Critical','service':'s3','issue':'Public S3 bucket','description':'Resource is publicly exposed'}; score, severity=calculate_risk(finding); assert score >= 90; assert severity == 'Critical'; print('Risk engine test passed')"